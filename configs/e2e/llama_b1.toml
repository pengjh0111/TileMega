[model]
path = "/root/models/llama3_2_1b"
name = "llama"

[workload]
batch = [1]
prompt_len = 64
max_new_tokens = 1024
prompts = "docs/experiments/SERVING_R10/prompts/passages.jsonl"

[device]
index = 0
cache_dir = "~/.cache/tilemega"

[solver]
passes = 2
top_m = 8
measure_top = 3
jobs = 3
mode = "auto"
pruning = true
time_budget_s = 600

[features]
pg = "auto"
handoff = "off"
sync = "calibrated"
arch_paths = "auto"
pdl = "auto"
weight_layout = "row"

[test]
warmup = 1
repeats = 3
hf_check = true
mode_check = true
guard = true
vllm = false
vllm_python = "/root/venv_vllm/bin/python"

[output]
dir = "runs/{model}-{timestamp}"
